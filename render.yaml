databases:
  - name: stratosphere-db
    databaseName: stratosphere
    user: stratosphere
    plan: free

services:
  - type: web
    name: stratosphere-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stratosphere-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 10080
      - key: AI_PROVIDER
        value: ollama
      - key: OLLAMA_HOST
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: hermes3:3b
      - key: CORS_ORIGINS
        value: http://localhost:3000
