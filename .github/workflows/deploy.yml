name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - deploy/Caddyfile
      - deploy/azure/**
      - .github/workflows/**
  workflow_dispatch:

# Queue deploys; never cancel one halfway through a release.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.service }} image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: backend
            build-args: ""
          - service: web
            context: frontend
            build-args: NEXT_PUBLIC_API_BASE_URL=/api
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the job token in .git/config for later steps (npm/uv scripts) to read.
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stratosphere-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Azure VM
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.SITE_ADDRESS }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the job token in .git/config for later steps (npm/uv scripts) to read.
          persist-credentials: false

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Release on the VM
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
          # Short-lived job token: lets the VM pull this commit's images and deploy files.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_name="deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          location="$(az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" --query location -o tsv)"
          # The run command keeps its (encrypted) parameters until deleted.
          trap 'az vm run-command delete -g "$RESOURCE_GROUP" --vm-name "$VM_NAME" -n "$run_name" --yes --no-wait >/dev/null 2>&1 || true' EXIT

          # Waits for the script to finish; its result is read from the instance view below.
          az vm run-command create \
            --resource-group "$RESOURCE_GROUP" \
            --vm-name "$VM_NAME" \
            --location "$location" \
            --run-command-name "$run_name" \
            --script @deploy/azure/release-on-vm.sh \
            --parameters \
              "REPO=$GITHUB_REPOSITORY" \
              "COMMIT_SHA=$GITHUB_SHA" \
              "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stratosphere" \
            --protected-parameters "GH_TOKEN=$GH_TOKEN" \
            --timeout-in-seconds 1200 \
            --output none || true

          view="$(az vm run-command show -g "$RESOURCE_GROUP" --vm-name "$VM_NAME" -n "$run_name" \
            --instance-view --query instanceView -o json)"
          jq -r '.output // ""' <<<"$view"
          jq -r '.error // ""' <<<"$view" >&2
          state="$(jq -r '.executionState' <<<"$view")"
          code="$(jq -r '.exitCode' <<<"$view")"
          echo "Run command finished: $state (exit code $code)"
          [[ "$state" == "Succeeded" && "$code" == "0" ]]

      - name: Check the public site
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://${{ vars.SITE_ADDRESS }}/api/health/ready"
